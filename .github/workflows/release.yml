name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Read by app/build.gradle.kts: versionCode = 100 + BUILD_NUMBER, versionName = 1.1.BUILD_NUMBER.
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION_NAME: 1.1.${{ github.run_number }}
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the release notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Signing secrets are only exposed to release builds of main, never to PR-controlled code.
      - name: Decode signing keystore
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (release signing)
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build release APK (debug signing)
        if: env.IS_RELEASE != 'true'
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect and verify APK
        run: |
          # The root build script redirects build output to ~/.gradle/project-builds.
          apk=$(find "$HOME/.gradle/project-builds/zzz-achievement/app/outputs/apk/release" -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/zzz-achievement-v${VERSION_NAME}.apk"

          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          certs=$("$apksigner" verify --print-certs "dist/zzz-achievement-v${VERSION_NAME}.apk")
          echo "$certs"
          if [ "$IS_RELEASE" = "true" ] && echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is debug-signed; check the signing secrets."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zzz-achievement-v${{ env.VERSION_NAME }}
          path: dist/*.apk
          retention-days: 14

      - name: Write release notes
        if: env.IS_RELEASE == 'true'
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..HEAD"
            echo "## 更新内容（自 $previous 起）" > notes.md
          else
            range="HEAD"
            echo "## 更新内容" > notes.md
          fi
          echo >> notes.md
          git log --no-merges --max-count=50 --pretty='- %s (%h)' $range >> notes.md
          cat notes.md

      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "v${VERSION_NAME}" \
            --notes-file notes.md \
            --latest
